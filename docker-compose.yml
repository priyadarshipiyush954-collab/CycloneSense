services:
  api:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /web
    volumes: ["./frontend:/web"]
    ports: ["3000:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on: [api]
