services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclone-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./app:/app/app
    develop:
      watch:
        - path: ./app
          action: sync
          target: /app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: cyclone-frontend
    ports:
      - "3000:5173"
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend/src:/frontend/src
    develop:
      watch:
        - path: ./frontend/src
          action: sync
          target: /frontend/src
